# Netlify configuration for Axiom Design Studio (Next.js App Router).
#
# The Next.js runtime plugin is what teaches Netlify to serve the App Router:
# static pages from the CDN, and /project/[id] (the one dynamic route) from a
# serverless function. Netlify installs the plugin automatically from this file;
# it does not need to be in package.json.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Matches the Node used locally (v22.x).
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Long-cache the fingerprinted build output. Everything else keeps Next's own
# cache headers.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Photography is large and never changes in place; the hero and team images are
# content-addressed by filename.
[[headers]]
  for = "/projects/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/team/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/hero/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
